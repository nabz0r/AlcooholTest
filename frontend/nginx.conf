limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /admin/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /static/ { alias /app/staticfiles/; }
  location /media/ {
    alias /app/media/;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'" always;
  }
  location = /assets/app.js { add_header Cache-Control "no-cache"; }
  location = /assets/style.css { add_header Cache-Control "no-cache"; }
  location /bottles/ { try_files $uri =404; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { proxy_pass http://api:8000; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
}
