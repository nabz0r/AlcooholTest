name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local test secrets and start the full stack
        run: ./scripts/bootstrap.sh
      - name: PostgreSQL integration tests
        run: docker compose exec -T api python manage.py test catalog --noinput
      - name: Schema and migration checks
        run: |
          docker compose exec -T api python manage.py makemigrations --check --dry-run
          docker compose exec -T api python manage.py check
          curl --fail --retry 10 --retry-delay 2 http://localhost:8088/api/v1/health
      - name: Inspect Python dependencies
        run: docker compose exec -T api pip list --format=json > dependencies.json
      - name: Save dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-inventory
          path: dependencies.json
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --disable-pip --no-deps
